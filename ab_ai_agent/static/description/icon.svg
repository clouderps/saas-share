<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghaima AI module icon — 140×140 px, Ghaima brand palette.

  Concept: a stylised "ai" wordmark inside a soft rounded square.
  The dot of the "i" is rendered as a glowing node — visual cue for
  "AI brain". Designed on a 4 px grid (IBM Carbon).

  Palette: --ghaima-navy (#0D00A2) background, --ghaima-blue (#005FF6)
           glow, --ghaima-cyan (#5DD8CA) inner node, white wordmark.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 140 140"
     width="140" height="140"
     role="img" aria-label="Ghaima AI">

  <!-- ── background tile ────────────────────────────── -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#005FF6" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#0D00A2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#070058" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#5DD8CA"/>
      <stop offset="80%" stop-color="#5DD8CA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5DD8CA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="bg">
    <rect x="6" y="6" width="128" height="128" rx="26" ry="26"
          fill="url(#glow)"/>
    <!-- subtle inner highlight on top edge -->
    <rect x="6" y="6" width="128" height="48" rx="26" ry="26"
          fill="white" fill-opacity="0.06"/>
  </g>

  <!-- ── wordmark "ai" ──────────────────────────────── -->
  <g id="wordmark" transform="translate(0,0)">
    <!-- a — geometric, two-stroke -->
    <path d="
        M 30 92
        L 30 70
        a 16 16 0 1 1 32 0
        L 62 92
        M 30 78
        L 62 78
        "
        fill="none"
        stroke="white"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- i — stem -->
    <rect x="79" y="64" width="10" height="28" rx="3"
          fill="white"/>
  </g>

  <!-- ── glowing dot of the "i" ─────────────────────── -->
  <g id="ai-dot">
    <!-- diffuse glow halo -->
    <circle cx="84" cy="48" r="14" fill="url(#dot)"/>
    <!-- crisp inner node -->
    <circle cx="84" cy="48" r="6" fill="#5DD8CA"/>
    <!-- highlight specular -->
    <circle cx="82" cy="46" r="2" fill="white" fill-opacity="0.85"/>
  </g>

  <!-- ── connecting trace from dot to i-stem ────────── -->
  <line x1="84" y1="56" x2="84" y2="64"
        stroke="#5DD8CA" stroke-width="2" stroke-linecap="round"
        opacity="0.7"/>
</svg>
